<video
  #landVideo
  autoplay
  muted
  loop
  playsinline
  class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 min-w-full min-h-full w-auto h-auto object-cover"
>
  <source src="/videos/land.mp4" type="video/mp4" />
</video>

<div
  aria-hidden="true"
  class="absolute top-0 left-0 w-full h-20 z-10 pointer-events-none"
  style="
    background: linear-gradient(
      to top,
      rgba(0, 0, 0, 0) 0%,
      rgba(31, 17, 0, 0.6) 80%,
      rgba(31, 17, 0, 0.9) 100%
    );
  "
></div>

<div
  aria-hidden="true"
  class="absolute bottom-0 left-0 w-full h-20 z-10 pointer-events-none"

      to bottom,
      rgba(0, 0, 0, 0) 0%,
      rgba(31, 17, 0, 0.6) 80%,
      rgba(31, 17, 0, 0.9) 100%
    );
  "
></div>
