<div class="flex flex-col">
  @for (item of items; track trackByTitle($index, item); let index = $index) {
    <div class="cert-row">
      <div
        class="cert-head"
        role="button"
        tabindex="0"
        (mouseenter)="onHover(index)"
        (mouseleave)="onUnhover()"
        (click)="onToggle(index)"
        (keydown.enter)="onToggle(index)"
        (keydown.space)="onToggle(index); $event.preventDefault()"
      >
        <div class="flex-1 min-w-0">
          <span
            class="cert-badge"
            [style.color]="item.accentColor"
            [style.background]="item.accentColor + '18'"
            >{{ item.badge }}</span
          >
          <div class="title-wrap">
            <h3 class="cert-title">{{ item.title }}</h3>
            @if (item.link) {
              <a
                [href]="item.link"
                target="_blank"
                rel="noopener noreferrer"
                (click)="$event.stopPropagation()"
                class="link-icon"
              >
                <svg
                  class="w-3 h-3"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M7 17 17 7" />
                  <path d="M7 7h10v10" />
                </svg>
              </a>
            }
          </div>
          <p class="cert-org">// {{ item.org }}</p>
        </div>

        <div class="flex items-center gap-3 flex-shrink-0 pt-0.5">
          <span class="cert-period">{{ item.period }}</span>
          <svg
            class="chevron"
            [class.open]="isExpanded(index)"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m6 9 6 6 6-6" />
          </svg>
        </div>
      </div>

      @if (isExpanded(index)) {
        <div class="cert-expand-wrap">
          <div
            class="cert-expand-inner"
            [style.background]="item.accentColor + '08'"
            [style.borderColor]="item.accentColor + '25'"
          >
            @if (item.details) {
              {{ item.details }}
            } @else {
              <span class="expand-empty">// DETAIL_RECORD PENDING · DATA INCOMING</span>
            }
          </div>
        </div>
      }
    </div>
  }
</div>
