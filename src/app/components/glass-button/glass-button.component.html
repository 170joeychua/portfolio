<div class="relative flex items-center justify-center">
  <button
    type="button"
    class="flex items-center justify-center align-middle select-none rounded-lg border border-white/50 bg-white/2.5 px-4 py-2 text-center text-2xl uppercase font-medium text-white backdrop-blur-sm shadow-[inset_0_1px_0px_rgba(255,255,255,0.75),0_0_9px_rgba(0,0,0,0.2),0_3px_8px_rgba(0,0,0,0.15)] transition-all duration-300 before:absolute before:inset-0 before:rounded-lg before:bg-gradient-to-br before:from-white/60 before:via-transparent before:to-transparent before:opacity-70 before:pointer-events-none after:absolute after:inset-0 after:rounded-lg after:bg-gradient-to-tl after:from-white/30 after:via-transparent after:to-transparent after:opacity-50 after:pointer-events-none antialiased hover:bg-white/30 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/60"
    (click)="handleClick($event)"
    [routerLink]="route"
  >
    {{ label }}
  </button>
  <span
    class="pointer-events-none absolute top-[50px] left-1/2 -translate-x-1/2 border-x-[10px] border-x-transparent border-t-[10px] border-t-white/60"
  ></span>
</div>
