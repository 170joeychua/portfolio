<div class="absolute inset-0 z-40 flex items-center justify-center pointer-events-none">
  <!-- Backdrop -->
  <div
    class="flex items-center justify-center w-full h-full"
    style="background: linear-gradient(180deg, rgba(0, 0, 0, 0.88), rgba(0, 0, 0, 0.4))"
  >
    <div
      class="absolute inset-0 pointer-events-auto z-0"
      aria-hidden="true"
      tabindex="0"
      role="button"
      (click)="exitToRoot()"
      (keyup.enter)="exitToRoot()"
      (keydown.enter)="exitToRoot()"
    ></div>

    <!-- Outer wrapper: positions all four corners relative to the dialog box -->
    <div class="pointer-events-auto relative z-10 w-full max-w-4xl mx-6">
      <!-- All four corners live here — outside the scrollable section -->
      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>

      <!-- Dialog -->
      <section
        #showcaseContainer
        (mousemove)="handleMouseMove($event)"
        (click)="$event.stopPropagation()"
        (keyup.enter)="$event.stopPropagation()"
        (keydown.enter)="$event.stopPropagation()"
        tabindex="0"
        class="relative w-full h-[680px] max-h-[85vh] overflow-hidden overflow-y-auto overscroll-none rounded-md px-10 py-10"
        style="
          background: #060c10;
          border: 1px solid rgba(0, 220, 200, 0.18);
          box-shadow:
            0 0 0 1px rgba(0, 220, 200, 0.06),
            0 40px 80px rgba(0, 0, 0, 0.85),
            inset 0 0 60px rgba(0, 220, 200, 0.02);
        "
      >
        <!-- Scanline overlay -->
        <div class="scanline-overlay"></div>

        <!-- Sweep line -->
        <div class="scan-sweep"></div>

        <!-- HUD live dots -->
        <div class="absolute top-6 right-10 flex items-center gap-1.5 z-10">
          <div class="hud-dot" style="animation-delay: 0s"></div>
          <div class="hud-dot" style="animation-delay: 0.6s"></div>
          <div class="hud-dot" style="animation-delay: 1.2s"></div>
        </div>

        <!-- System label top-left -->
        <div class="absolute top-6 left-10 z-10">
          <span class="xr-sys-label">SYS::PROFILE_SCAN · RECOGNITION_MODULE v26.0</span>
        </div>

        <!-- Header -->
        <div class="mt-6 mb-7 text-center sm:text-left">
          <h2 class="xr-heading mb-2">RECOGNITION <em class="xr-heading-em">SPOTLIGHT</em></h2>
          <p class="xr-subheading">// ACHIEVEMENTS · CERTIFICATIONS · COMMUNITY_INVOLVEMENT</p>
        </div>

        <!-- Tab selector — PrimeNG SelectButton styled via SCSS -->
        <div class="mb-7 xr-tabs-wrap">
          <p-selectButton
            [options]="tabs"
            [(ngModel)]="activeTab"
            optionLabel="label"
            optionValue="id"
          />
        </div>

        <!-- Divider -->
        <div class="xr-divider mb-5"></div>
        <app-recognition-list
          [items]="getActiveItems()"
          [tabPrefix]="activeTab"
          [expandedKey]="expandedKey"
          (hovered)="handleMouseEnter($event)"
          (unhovered)="handleMouseLeave()"
          (expandToggle)="toggleExpand($event)"
        />

        <!-- Status bar -->
        <div class="xr-status-bar">
          <span>SCAN: {{ activeTabCount }} TARGETS DETECTED</span>
          <span>{{ currentTime }}</span>
          <span>THERMAL_OVERLAY: ON</span>
        </div>
      </section>
    </div>
    <!-- /outer wrapper -->
  </div>

  <!-- Floating cursor preview -->
  <div
    class="pointer-events-none fixed z-50 overflow-hidden rounded-2xl transition-[opacity,transform] duration-200 ease-out"
    [ngStyle]="{
      left: smoothPosition.x + 22 + 'px',
      top:  smoothPosition.y - 90 + 'px',
      transform: 'scale(' + (isPreviewVisible ? 1 : 0.88) + ')',
      opacity: isPreviewVisible ? 1 : 0
    }"
  >
    <div
      class="relative overflow-hidden rounded-2xl"
      style="
        height: 300px;
        width: 420px;
        background: rgba(0, 220, 200, 0.05);
        box-shadow:
          0 24px 60px rgba(0, 0, 0, 0.7),
          0 0 0 1px rgba(0, 220, 200, 0.15);
      "
    >
      @if (activePreviewImage) {
      <img
        [src]="activePreviewImage"
        alt="Preview"
        class="preview-image absolute inset-0 h-full w-full object-cover"
        [class.preview-image--colorized]="isPreviewColorized"
      />
      <!-- Scan overlay on preview image -->
      <div
        class="absolute inset-0"
        style="
          background: repeating-linear-gradient(
            0deg,
            transparent,
            transparent 3px,
            rgba(0, 220, 200, 0.05) 3px,
            rgba(0, 220, 200, 0.05) 4px
          );
        "
      ></div>
      }
      <div
        class="absolute inset-0"
        style="background: linear-gradient(to top, rgba(0, 0, 0, 0.5), transparent)"
      ></div>
      <!-- Corner brackets on preview -->
      <div
        style="
          position: absolute;
          top: 8px;
          left: 8px;
          width: 14px;
          height: 14px;
          border-top: 2px solid rgba(0, 220, 200, 0.6);
          border-left: 2px solid rgba(0, 220, 200, 0.6);
        "
      ></div>
      <div
        style="
          position: absolute;
          top: 8px;
          right: 8px;
          width: 14px;
          height: 14px;
          border-top: 2px solid rgba(0, 220, 200, 0.6);
          border-right: 2px solid rgba(0, 220, 200, 0.6);
        "
      ></div>
      <div
        style="
          position: absolute;
          bottom: 8px;
          left: 8px;
          width: 14px;
          height: 14px;
          border-bottom: 2px solid rgba(0, 220, 200, 0.6);
          border-left: 2px solid rgba(0, 220, 200, 0.6);
        "
      ></div>
      <div
        style="
          position: absolute;
          bottom: 8px;
          right: 8px;
          width: 14px;
          height: 14px;
          border-bottom: 2px solid rgba(0, 220, 200, 0.6);
          border-right: 2px solid rgba(0, 220, 200, 0.6);
        "
      ></div>
    </div>
  </div>
</div>
