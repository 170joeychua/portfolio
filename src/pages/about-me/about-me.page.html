<!-- Singapore, Languages, Top 3 work DNA, Summary-->

<div class="absolute inset-0 z-40 flex items-center justify-center pointer-events-none">
  <!-- Backdrop -->
  <div
    class="flex items-center justify-center w-full h-full backdrop-blur-[4px]"
    style="
      background:
        radial-gradient(circle at top, rgba(255, 255, 255, 0.08), transparent 45%),
        linear-gradient(180deg, rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.15));
    "
  >
    <!-- Card shell: aged cream paper -->
    <div
      class="relative h-fit w-[1080px] rounded-[18px] border-[3px] border-[#b8a87a] shadow-2xl p-[18px] box-border overflow-hidden"
      style="
        background-color: #f5edcf;
        background-image: linear-gradient(160deg, #fdf6e0 0%, #f0e0b0 50%, #ede0b8 100%);
        box-shadow:
          0 8px 40px rgba(0, 0, 0, 0.55),
          inset 0 0 60px rgba(180, 160, 100, 0.18);
        font-family: 'Special Elite', cursive;
      "
    >
      <!-- Inner blue border 96a6c7 -->
      <div
        class="flex flex-col h-[580px] justify-center overflow-hidden relative px-[50px]"
        style="border: 14px solid #572b00; border-radius: 10px"
      >
        <p class="text-end font-mono text-lg uppercase text-[#4a3e2a] tracking-[0.25em] my-6">
          License of Software Engineering
        </p>
        <div class="flex flex-row">
          <!-- Photo column -->
          <div class="flex items-center pr-10" style="width: 360px">
            <div
              class="w-full overflow-hidden border-[2px]"
              style="border-color: #8a7a58; background: #c8bfa8"
            >
              @if (data.photoUrl) {
              <img
                [src]="data.photoUrl"
                alt="ID Photo"
                class="w-full h-full object-cover"
                style="filter: sepia(18%) contrast(1.05)"
              />
              }
            </div>
          </div>

          <!-- Info column -->
          <div class="flex flex-col flex-1 p-2 justify-center gap-y-2">
            <!-- Title & number -->

            <!-- Fields -->
            @for (field of data.fields; track field.label) {
            <div class="flex font-mono items-end gap-y-1 pb-[4px] mb-[6px] gap-x-2">
              <span
                class="text-base w-fit capitalize tracking-wider text-[#5a4e38] whitespace-nowrap"
                >{{ field.label }}</span
              >
              <span
                class="font-[Caveat] text-[32px] w-full font-bold text-center justify-center items-center text-[#572b00] inline-block"
                style="border-bottom: 4px dotted #9a8c6a"
              >
                {{ field.value }}
              </span>
            </div>
            }
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
